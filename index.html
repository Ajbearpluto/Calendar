<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAIJI Omniverse Creator - Minimalist Edition</title>
    <script src="https://unpkg.com/lunar-javascript/lunar.js"></script>
    <style>
        /* 引入無印良品風的高級無襯線字體 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        
        :root {
            --text-main: #2D3436;
            --text-sub: #636E72;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            --shadow-hover: 0 12px 40px 0 rgba(31, 38, 135, 0.12);
        }

        /* 優雅的動態流動漸層背景 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(-45deg, #e0eafc, #cfdef3, #f5f7fa, #e4efe9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* 核心組件：毛玻璃懸浮卡片 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
            padding: 40px;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        /* 頂部控制台 */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-radius: 50px;
        }
        .control-panel input {
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 700;
            outline: none;
        }
        .btn-refresh {
            cursor: pointer;
            font-weight: 700;
            color: var(--text-main);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-refresh:hover { opacity: 0.6; }

        /* 日期與宜忌區塊 */
        .header-section { text-align: center; }
        .date-title {
            font-weight: 900;
            font-size: 3rem;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }
        .date-subtitle {
            font-size: 1.1rem;
            color: var(--text-sub);
            letter-spacing: 4px;
            margin: 0 0 30px 0;
            font-weight: 300;
        }
        .do-dont-box {
            display: inline-flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.5);
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .do-dont-box .do { color: #27ae60; }
        .do-dont-box .dont { color: #d63031; }

        /* 故事與金句區塊 */
        .story-section { position: relative; }
        .badge-style {
            position: absolute;
            top: -15px;
            left: 40px;
            background: var(--text-main);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .story-content {
            font-size: 1.15rem;
            line-height: 1.8;
            font-weight: 400;
            margin: 20px 0 30px 0;
            white-space: pre-line;
        }
        .quote-content {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.6;
            border-left: 4px solid var(--text-main);
            padding-left: 20px;
            margin: 0;
        }

        /* 創作者雙欄輸出區 */
        .creator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        .output-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .output-box h3 { margin: 0; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        
        .btn-action {
            background: var(--text-main);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-action:hover {
            background: #000000;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        textarea.code-box {
            width: 100%;
            flex-grow: 1;
            min-height: 220px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            font-family: 'Noto Sans TC', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-sub);
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        .preview-img {
            width: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: var(--shadow-soft);
            background: rgba(255,255,255,0.2);
        }

        @media (max-width: 768px) {
            .creator-grid { grid-template-columns: 1fr; }
            .do-dont-box { flex-direction: column; gap: 10px; }
            .date-title { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 控制台 -->
        <div class="glass-card control-panel">
            <input type="date" id="ui-date-picker" value="2026-09-02" onchange="applyDateChange()">
            <div class="btn-refresh" onclick="randomizeAll()">
                <span>🔄 刷新情緒盲盒</span>
            </div>
        </div>

        <!-- 日期與宜忌 -->
        <div class="glass-card header-section">
            <h1 class="date-title" id="display-date">2026.09.02</h1>
            <p class="date-subtitle" id="display-lunar">農曆七月廿一 ｜ ♉ 金牛座</p>
            <div class="do-dont-box">
                <div>宜 <span class="do" id="ui-do">摸魚</span></div>
                <div>忌 <span class="dont" id="ui-dont">點開群組</span></div>
            </div>
        </div>

        <!-- 故事與金句 -->
        <div class="glass-card story-section">
            <div class="badge-style" id="ui-style-badge">極致反差</div>
            <div class="story-content" id="ui-article">盯著這片佈滿水珠的蕨類，感覺心靈都被洗滌了。<br>就像我現在坐在辦公桌前，盯著滿滿的待辦清單，眼角滑落的社畜之淚一樣，晶瑩剔透。</div>
            <h2 class="quote-content" id="ui-quote">"大家都說生活不只有詩和遠方。對，因為還有眼前的無薪加班。"</h2>
        </div>

        <!-- 產出區 -->
        <div class="creator-grid">
            <!-- 左欄：視覺產出 -->
            <div class="glass-card output-box">
                <h3>🎨 視覺產出 (Visual Prompt)</h3>
                <button class="btn-action" onclick="copyText('rawPrompt', 'btnMsgAI')" id="btnMsgAI">📸 複製大師級算圖指令</button>
                <textarea id="rawPrompt" class="code-box" readonly></textarea>
                <span style="font-size: 0.85rem; color: var(--text-sub); margin-top: 10px;">✨ AI 草圖預覽 (靈感參考，高純度請依賴上方 Prompt)：</span>
                <img id="ai-image-result" class="preview-img" src="" alt="AI Preview">
            </div>

            <!-- 右欄：社群文案 -->
            <div class="glass-card output-box">
                <h3>📱 脆 (Threads) 專屬排版</h3>
                <button class="btn-action" onclick="copyText('igCaption', 'btnMsgIG')" id="btnMsgIG">📋 複製 Threads 貼文</button>
                <textarea id="igCaption" class="code-box" readonly style="color: var(--text-main); font-weight: 500;"></textarea>
            </div>
        </div>
    </div>

    <script>
        const quotesData = [{"style": "極致反差", "article": "早晨陽光灑在窗邊，手沖咖啡飄著微苦香氣，深吸一口初秋微風，然後想起戶頭只剩87元，靠北要遲到了。", "q": "生活有詩和遠方，但打卡鐘只認遲到扣錢。", "p": "月底吃土與社畜現實", "do": "壓線打卡", "dont": "看網銀餘額"}, {"style": "滿血復活", "article": "主管又在群組發瘋，客戶瘋狂改圖。但我打開行事曆：後天發薪水！突然覺得全世界的鳥事都像在替我放煙火。", "q": "只要錢到位，受點委屈全當是精神撫慰金。", "p": "上班被狗咬與發薪日續命", "do": "大口喝奶茶", "dont": "跟瘋子計較"}, {"style": "人間清醒", "article": "別再焦慮三十歲該存多少錢了。老闆畫的餅吃不飽，同事的瓜吃不完，下班關掉通知，世界運轉根本不需要你操心。", "q": "月薪三萬就做好三萬的事，別拿命替資本家圓夢。", "p": "職場畫大餅與存錢焦慮", "do": "準時閃人", "dont": "秒回訊息"}, {"style": "躺平無罪", "article": "想離職第800天，存錢進度0%。今天決定不努力了，洗完澡直接鑽進被窩，當個會呼吸的肉塊，爽度破表。", "q": "只要我放棄得夠快，困難就追不上我。", "p": "想離職又不敢與廢物日常", "do": "原地躺平", "dont": "自我反省"}, {"style": "微小幸運", "article": "走去捷運站一路綠燈，買早餐阿姨多送了一顆荷包蛋，耳機剛好播到最愛的歌。今天，好像也沒那麼糟糕。", "q": "生活給的巴掌再多，一顆蛋就能暫時原諒世界。", "p": "日常微小確幸與自我療癒", "do": "吃飽睡好", "dont": "預支煩惱"}]; 
        let payload = {"date": "2026-09-02", "star_sign": "金牛座", "zodiac_sign": "羊"};
        
        // 🌟 階段三：視文連動引擎 (將 LLM 產出的情緒 Style，強制對齊神級光學參數)
        const visualMapping = {
            "極致反差": { 
                genre: "Cinematic neo-noir macro photography", 
                subject: "extreme close-up of morning dew resting on a vibrant green fern leaf, dark moody background", 
                modifier: "high contrast, dramatic lighting, subtle melancholy atmosphere, 8k resolution, shot on 100mm macro lens" 
            },
            "滿血復活": { 
                genre: "Epic National Geographic landscape photography", 
                subject: "a magnificent sunrise over snow-capped mountain peaks reflecting perfectly on a serene alpine lake", 
                modifier: "golden hour sunlight, majestic scale, awe-inspiring, ultra-detailed, shot with an ultra-wide 14mm lens" 
            },
            "人間清醒": { 
                genre: "Minimalist architectural photography", 
                subject: "a sleek minimalist concrete structure with dramatic geometric light and shadow", 
                modifier: "clean lines, Zen atmosphere, editorial magazine style, highly detailed, photorealistic" 
            },
            "躺平無罪": { 
                genre: "Cozy lifestyle editorial photography", 
                subject: "a cute fluffy cat sleeping peacefully next to a pile of old books near a sunlit window", 
                modifier: "soft warm ambient light, dreamy vibe, masterpiece, Kodak Portra 400 film aesthetic" 
            },
            "微小幸運": { 
                genre: "Vintage aesthetic photography", 
                subject: "a vintage glass siphon coffee maker actively brewing coffee, rich steam rising", 
                modifier: "warm glowing cafe lighting, macro details, cozy morning sunlight, shot on 50mm lens, f/1.8" 
            }
        };

        function getAstrologySignsByDate(dateStr) {
            const d = new Date(dateStr + "T00:00:00");
            const year = d.getFullYear(); const month = d.getMonth() + 1; const day = d.getDate();
            const stars = ["水瓶座", "雙魚座", "牡羊座", "金牛座", "雙子座", "巨蟹座", "獅子座", "處女座", "天秤座", "天蠍座", "射手座", "摩羯座"];
            return { star: stars[(year + month + day + 6) % 12] };
        }

        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function applyDateChange() {
            const dateVal = document.getElementById('ui-date-picker').value;
            if(!dateVal) return;
            const luckySigns = getAstrologySignsByDate(dateVal);
            payload.star_sign = luckySigns.star;
            randomizeAll(dateVal);
        }

        function randomizeAll(currentDate = document.getElementById('ui-date-picker').value) {
            // 處理日期格式 (將 - 換成 .)
            const displayDate = currentDate.replace(/-/g, '.');
            document.getElementById('display-date').innerText = displayDate;

            // 處理農曆
            let lunarDisplay = "農曆查無資料";
            try {
                const d = new Date(currentDate + "T00:00:00");
                if (typeof Lunar !== 'undefined') {
                    const lunar = Lunar.fromDate(d);
                    lunarDisplay = `農曆${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                    const jieQi = lunar.getJieQi();
                    if(jieQi) lunarDisplay += ` ｜ 節氣: ${jieQi}`;
                }
            } catch (e) {}
            
            document.getElementById('display-lunar').innerText = `${lunarDisplay} ｜ ${payload.star_sign}`;

            // 抽取故事與情緒
            const selectedData = Array.isArray(quotesData) ? getRandomItem(quotesData) : quotesData;
            
            const style = selectedData.style || "微小幸運";
            const doAction = selectedData.do || "呼吸";
            const dontAction = selectedData.dont || "焦慮";
            const articleText = selectedData.article || "生活就像一面鏡子。";
            const quoteText = selectedData.q || "努力活著。";
            const painTag = selectedData.p || "日常碎片";

            document.getElementById('ui-style-badge').innerText = style;
            document.getElementById('ui-do').innerText = doAction;
            document.getElementById('ui-dont').innerText = dontAction;
            document.getElementById('ui-article').innerHTML = articleText.replace(/\n/g, '<br>');
            document.getElementById('ui-quote').innerText = `"${quoteText}"`;

            // 🔥 視文連動：根據抽到的情緒 Style，精準抓取對應的視覺光學參數
            const visual = visualMapping[style] || visualMapping["微小幸運"];
            const fullPrompt = `${visual.genre} of ${visual.subject}. ${visual.modifier}, masterpiece, award-winning, photorealistic --ar 9:16 --v 6.0`;
            document.getElementById('rawPrompt').value = fullPrompt;

            // 更新預覽圖 (傳送簡化版 prompt 給免費 API)
            const safeUrlPrompt = encodeURIComponent(`${visual.genre} of ${visual.subject}, highly detailed`);
            document.getElementById('ai-image-result').src = `https://image.pollinations.ai/prompt/${safeUrlPrompt}?width=1080&height=1920&nologo=true`;

            // 📱 Threads 專屬排版文案
            const threadsText = `📅 ${displayDate}｜${lunarDisplay}｜${payload.star_sign}\n💡 今日指南：宜 ${doAction}｜忌 ${dontAction}\n\n【日曆小故事】\n${articleText}\n\n"${quoteText}"\n\n#日曆 #生活碎片 #${painTag} #攝影紀錄`;
            document.getElementById('igCaption').value = threadsText;
        }

        window.onload = function() { 
            setTimeout(() => { applyDateChange(); }, 200); 
        };

        function copyText(elementId, btnId) {
            var copyText = document.getElementById(elementId);
            copyText.select(); 
            document.execCommand("copy");
            var btn = document.getElementById(btnId);
            var originalText = btn.innerHTML;
            btn.innerHTML = "✅ 已複製成功！";
            setTimeout(function() { btn.innerHTML = originalText; }, 2000);
        }
    </script>
</body>
</html>
