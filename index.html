        .control-panel { display: flex; flex-direction: column; gap: 15px; }

        .p-bottom { width: 100%; box-sizing: border-box; }
        .p-fortune { display: flex; gap: 8px; }

        function injectQuotesToMatrix() {
            let allAvailableQuotes = [...localExpansionQuotes];
            if (Array.isArray(quotesData)) {
                allAvailableQuotes = allAvailableQuotes.concat(quotesData);
            } else if (quotesData && quotesData.style) {
                allAvailableQuotes.push(quotesData);
            }

            allAvailableQuotes.forEach(q => {
                let style = q.style || "";
                if (["躺平無罪", "極致反差", "滿血復活"].includes(style)) omniverseMatrix.worklife.quotes.push(q);
                else if (["微小幸運", "童話角落"].includes(style)) omniverseMatrix.animals.quotes.push(q);
                else if (["浩瀚宇宙"].includes(style)) omniverseMatrix.epic_nature.quotes.push(q);
                else if (["人間清醒", "禪意留白"].includes(style)) omniverseMatrix.macro_zen.quotes.push(q);
                else omniverseMatrix.worklife.quotes.push(q);
            });

            // 確保每種風格至少有一句話
            Object.values(omniverseMatrix).forEach((matrix, index) => {
                if(matrix.quotes.length === 0) matrix.quotes.push(localExpansionQuotes[index]);
            });
        }

        function getAstrologySign(month, day) {
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "♈ 牡羊座";
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "♉ 金牛座";
            if ((month == 5 && day >= 21) || (month == 6 && day <= 21)) return "♊ 雙子座";
            if ((month == 6 && day >= 22) || (month == 7 && day <= 22)) return "♋ 巨蟹座";
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "♌ 獅子座";
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "♍ 處女座";
            if ((month == 9 && day >= 23) || (month == 10 && day <= 23)) return "♎ 天秤座";
            if ((month == 10 && day >= 24) || (month == 11 && day <= 22)) return "♏ 天蠍座";
            if ((month == 11 && day >= 23) || (month == 12 && day <= 21)) return "♐ 射手座";
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "♑ 摩羯座";
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "♒ 水瓶座";
            return "♓ 雙魚座";
        }

        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function triggerTearAnimation() {
            // 這裡不需要撕紙動畫了，直接刷新四宮格
            const dateInput = document.getElementById('ui-date-picker');
            let currentDate = new Date(dateInput.value);
            currentDate.setDate(currentDate.getDate() + 1);
            dateInput.value = currentDate.toISOString().split('T')[0];
            randomizeAll();
        }

        function applyDateChange() { randomizeAll(); }

        function downloadPoster(wrapperId, btnElement) {
            const posterWrapper = document.getElementById(wrapperId);
            const originalText = btnElement.innerHTML;
            
            btnElement.innerHTML = "⏳ 魔法渲染中...";
            btnElement.style.opacity = "0.7"; btnElement.style.pointerEvents = "none";

            const ym = document.querySelector(`#${wrapperId} .p-ym`).innerText.replace('.', '');
            const day = document.querySelector(`#${wrapperId} .p-day`).innerText;
            const fileName = `Taiji_Calendar_${ym}${day}_${wrapperId}.png`;

            html2canvas(posterWrapper, { scale: 3, useCORS: true, backgroundColor: "transparent" }).then(canvas => {
                const link = document.createElement('a'); link.download = fileName;
                link.href = canvas.toDataURL('image/png'); link.click();
                btnElement.innerHTML = "✅ 下載完成！";
                setTimeout(() => { btnElement.innerHTML = originalText; btnElement.style.opacity = "1"; btnElement.style.pointerEvents = "auto"; }, 2000);
            }).catch(err => {
                btnElement.innerHTML = "❌ 失敗";
                setTimeout(() => { btnElement.innerHTML = originalText; btnElement.style.opacity = "1"; btnElement.style.pointerEvents = "auto"; }, 2000);
            });
        }

        // 🔥 零一引擎：一次為四個宇宙賦予獨立靈魂與圖片！
        function randomizeAll(currentDate = document.getElementById('ui-date-picker').value) {
            const dObj = new Date(currentDate + "T00:00:00");
            const y = dObj.getFullYear(); const m = dObj.getMonth() + 1; const d = dObj.getDate();
            
            const dayStr = String(d).padStart(2, '0');
            const ymStr = `${y}.${String(m).padStart(2, '0')}`;
            const exactStarSign = getAstrologySign(m, d);

            let lunarDisplay = "農曆查無資料";
            try {
                if (typeof Lunar !== 'undefined') {
                    const lunar = Lunar.fromDate(dObj);
                    lunarDisplay = `農曆${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                }
            } catch (e) {}

            // 更新左側控制台資訊
            document.getElementById('today-stats').innerHTML = `
                <strong>${ymStr}.${dayStr}</strong><br>
                ${lunarDisplay} ｜ ${exactStarSign}
            `;

            // 定義四個平行宇宙的綁定關係
            const universes = [
                { id: 'worklife', catKey: 'worklife' },
                { id: 'animals', catKey: 'animals' },
                { id: 'epic', catKey: 'epic_nature' },
                { id: 'macro', catKey: 'macro_zen' }
            ];

            // 迴圈遍歷四張海報，分別給予獨立的生命！
            universes.forEach(universe => {
                const matrix = omniverseMatrix[universe.catKey];
                
                // 1. 抽出不同的字
                const quoteObj = getRandomItem(matrix.quotes);
                const doAction = quoteObj.do || "呼吸";
                const dontAction = quoteObj.dont || "焦慮";
                const quoteText = quoteObj.q || "努力活著。";

                // 2. 抽出不同的圖片 Prompt 並加上獨立亂數
                const subjectStr = getRandomItem(matrix.subjects);
                const modifierStr = getRandomItem(matrix.modifiers);
                const fullPrompt = `${matrix.basePrompt} ${subjectStr}. ${modifierStr}`;
                
                const randomSeed = Math.floor(Math.random() * 1000000);
                const safeUrlPrompt = encodeURIComponent(`${fullPrompt}, photorealistic`);
                const imgUrl = `https://image.pollinations.ai/prompt/${safeUrlPrompt}?width=1080&height=1920&nologo=true&seed=${randomSeed}`;

                // 3. 注入到對應的海報 HTML 節點中 (保留相同的日期，不同的圖片與文字)
                const wrapper = document.getElementById(`poster-${universe.id}`);
                
                wrapper.querySelector('.poster-bg').src = imgUrl;
                wrapper.querySelector('.p-day').innerText = dayStr;
                wrapper.querySelector('.p-ym').innerText = ymStr;
                wrapper.querySelector('.p-lunar').innerText = lunarDisplay;
                
                wrapper.querySelectorAll('.p-do').forEach(el => el.innerText = doAction);
                wrapper.querySelectorAll('.p-dont').forEach(el => el.innerText = dontAction);
                wrapper.querySelector('.p-quote').innerText = `「${quoteText}」`;
            });
        }

        window.onload = function() { 
            injectQuotesToMatrix();
            if(!document.getElementById('ui-date-picker').value || document.getElementById('ui-date-picker').value === "2026-09-04") {
                const today = new Date();
                document.getElementById('ui-date-picker').value = today.toISOString().split('T')[0];
            }
            randomizeAll();
        };
    </script>
</body>
