        ];
        
        const promptSubjects = [
            "a young Asian woman peacefully drinking coffee and reading a book by a sunlit window",
            "a smiling barista gracefully crafting latte art in a bright bustling morning cafe",
            "a person in a cozy sweater writing in a journal at a sun-drenched wooden dining table",
            "a sleepy tabby cat curled up on a pile of old books bathed in warm morning sunlight",
            "a cheerful golden retriever resting happily on a sun-drenched wooden porch",
            "a small bird perched perfectly on a blooming cherry blossom branch",
            "an extreme close-up of crystal clear morning dew resting on a vibrant green fern leaf",
            "a breathtaking panoramic view of a lush green valley and a pristine alpine lake",
            "a beautifully plated rustic Spanish potato tortilla on a ceramic dish surrounded by fresh herbs",
            "a vintage glass siphon coffee maker actively brewing coffee with rich steam rising"
        ];
        
        const promptModifiers = [
            "bathed in bright morning sunlight, warm and cheerful atmosphere, soft shadows, 8k, photorealistic",
            "shot on 35mm lens, Fujifilm Superia 400 simulation, bright and airy, natural daylight, masterpiece",
            "soft pastel color palette, gentle golden hour sunlight streaming through windows, cozy and uplifting mood",
            "vibrant natural colors, crystal clear focus, high definition, deeply emotional and serene",
            "sun-drenched, glowing light leaks, pure and peaceful vibe, highly detailed, photorealistic"
        ];

        function getAstrologySign(month, day) {
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "♈ 牡羊座";
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "♉ 金牛座";
            if ((month == 5 && day >= 21) || (month == 6 && day <= 21)) return "♊ 雙子座";
            if ((month == 6 && day >= 22) || (month == 7 && day <= 22)) return "♋ 巨蟹座";
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "♌ 獅子座";
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "♍ 處女座";
            if ((month == 9 && day >= 23) || (month == 10 && day <= 23)) return "♎ 天秤座";
            if ((month == 10 && day >= 24) || (month == 11 && day <= 22)) return "♏ 天蠍座";
            if ((month == 11 && day >= 23) || (month == 12 && day <= 21)) return "♐ 射手座";
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "♑ 摩羯座";
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "♒ 水瓶座";
            return "♓ 雙魚座";
        }

        function seededRandom(seed) { let x = Math.sin(seed++) * 10000; return x - Math.floor(x); }
        function getLuckyItems(seed, array, count) {
            let result = []; let tempArray = [...array]; let currentSeed = seed;
            for(let i=0; i<count; i++) {
                let idx = Math.floor(seededRandom(currentSeed++) * tempArray.length);
                result.push(tempArray[idx]); tempArray.splice(idx, 1);
            }
            return result;
        }

        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function triggerTearAnimation() {
            const paper = document.getElementById('calendar-paper');
            paper.classList.remove('anim-appear');
            paper.classList.add('anim-tear');
            setTimeout(() => { randomizeAll(); paper.classList.remove('anim-tear'); paper.classList.add('anim-appear'); }, 500); 
        }

        function applyDateChange() { triggerTearAnimation(); }

        function loadCustomBg(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('poster-bg-img').src = e.target.result; }
                reader.readAsDataURL(file);
            }
        }

        function downloadPoster() {
            const poster = document.getElementById('ig-poster-canvas');
            const btn = document.getElementById('btnDownload');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = "⏳ 魔法渲染中 (請稍候)...";
            btn.style.opacity = "0.7"; btn.style.pointerEvents = "none";

            html2canvas(poster, { scale: 3, useCORS: true, backgroundColor: "#1A1A1A" }).then(canvas => {
                const ym = document.getElementById('p-ym').innerText.replace('.', '');
                const day = document.getElementById('p-day').innerText;
                const fileName = `Taiji_Calendar_${ym}${day}.png`;

                const link = document.createElement('a'); link.download = fileName;
                link.href = canvas.toDataURL('image/png'); link.click();

                btn.innerHTML = "✅ 海報下載完成！";
                setTimeout(() => { btn.innerHTML = originalText; btn.style.opacity = "1"; btn.style.pointerEvents = "auto"; }, 2000);
            }).catch(err => {
                btn.innerHTML = "❌ 渲染失敗";
                setTimeout(() => { btn.innerHTML = originalText; btn.style.opacity = "1"; btn.style.pointerEvents = "auto"; }, 2000);
            });
        }

        function randomizeAll(currentDate = document.getElementById('ui-date-picker').value) {
            const dObj = new Date(currentDate + "T00:00:00");
            const y = dObj.getFullYear(); const m = dObj.getMonth() + 1; const d = dObj.getDate();
            
            const dayStr = String(d).padStart(2, '0');
            const ymStr = `${y}.${String(m).padStart(2, '0')}`;
            const numericSeed = parseInt(`${y}${String(m).padStart(2, '0')}${dayStr}`);
            
            const exactStarSign = getAstrologySign(m, d);
            
            document.getElementById('ui-day').innerText = dayStr; document.getElementById('ui-ym').innerText = ymStr;
            document.getElementById('ui-star-sign').innerText = exactStarSign;
            
            document.getElementById('p-day').innerText = dayStr; document.getElementById('p-ym').innerText = ymStr;

            let lunarDisplay = "農曆查無資料"; let lunarPure = "農曆查無資料";
            try {
                if (typeof Lunar !== 'undefined') {
                    const lunar = Lunar.fromDate(dObj);
                    lunarPure = `農曆${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}`;
                    lunarDisplay = lunarPure;
                    const jieQi = lunar.getJieQi();
                    if(jieQi) lunarDisplay += ` ｜ 節氣：${jieQi}`;
                }
            } catch (e) {}
            
            document.getElementById('ui-lunar').innerText = lunarDisplay;
            document.getElementById('p-lunar').innerText = lunarPure; 

            const allStars = ["♈ 牡羊", "♉ 金牛", "♊ 雙子", "♋ 巨蟹", "♌ 獅子", "♍ 處女", "♎ 天秤", "♏ 天蠍", "♐ 射手", "♑ 摩羯", "♒ 水瓶", "♓ 雙魚"];
            const allZodiacs = ["🐭 肖鼠", "🐮 肖牛", "🐯 肖虎", "🐰 肖兔", "🐲 肖龍", "🐍 肖蛇", "🐴 肖馬", "🐑 肖羊", "🐵 肖猴", "🐔 肖雞", "🐶 肖狗", "🐷 肖豬"];
            const luckyStars = getLuckyItems(numericSeed, allStars, 3);
            const luckyZodiacs = getLuckyItems(numericSeed + 999, allZodiacs, 3);
            
            document.getElementById('ui-lucky-stars').innerHTML = luckyStars.map(s => `<span class="tag-pill star">${s}</span>`).join('');
            document.getElementById('ui-lucky-zodiacs').innerHTML = luckyZodiacs.map(z => `<span class="tag-pill zodiac">${z}</span>`).join('');

            // 🔥 零一擴充：將 AI 每日抓取的資料庫與內建擴充庫結合，確保無盡變化！
            let allAvailableQuotes = [...localExpansionQuotes];
            if (Array.isArray(dailyQuotesData)) {
                allAvailableQuotes = allAvailableQuotes.concat(dailyQuotesData);
            } else if (dailyQuotesData && dailyQuotesData.style) {
                allAvailableQuotes.push(dailyQuotesData);
            }
            
            const selectedData = getRandomItem(allAvailableQuotes);
            const igMusic = getRandomItem(igMusicLibrary);
            
            const style = selectedData.style || "微小幸運";
            const doAction = selectedData.do || "呼吸";
            const dontAction = selectedData.dont || "焦慮";
            const articleText = selectedData.article || "生活就像一面鏡子。";
            const quoteText = selectedData.q || "努力活著。";
            const painTag = selectedData.p || "日常碎片";

            document.getElementById('ui-style-badge').innerText = style;
            document.getElementById('ui-do').innerText = doAction; document.getElementById('ui-dont').innerText = dontAction;
            document.getElementById('p-do').innerText = doAction; document.getElementById('p-dont').innerText = dontAction;
            
            document.getElementById('ui-article').innerHTML = articleText.replace(/\n/g, '<br>');
            document.getElementById('ui-quote').innerText = `「${quoteText}」`; document.getElementById('p-quote').innerText = `「${quoteText}」`;

            const fullSongInfo = `${igMusic.track} - ${igMusic.artist}`;
            document.getElementById('ui-music-text').innerText = "IG 配樂建議：" + fullSongInfo;
            document.getElementById('ui-music-btn').href = `https://www.youtube.com/watch?v=${igMusic.yt_id}`;

            const genre = getRandomItem(promptGenres);
            const subject = getRandomItem(promptSubjects);
            const modifier = getRandomItem(promptModifiers);
            
            const purePrompt = `${genre} of ${subject}. ${modifier} --ar 9:16 --style raw --v 6.0`;
            document.getElementById('purePrompt').value = purePrompt;
            
            const safeUrlPrompt = encodeURIComponent(`${genre} of ${subject}, highly detailed`);
            document.getElementById('poster-bg-img').src = `https://image.pollinations.ai/prompt/${safeUrlPrompt}?width=1080&height=1920&nologo=true`;
            
            const threadsText = `📅 ${ymStr}.${dayStr}｜${lunarDisplay}｜${exactStarSign}\n✨ 宇宙寵兒：${luckyStars.join(' ')} ${luckyZodiacs.join(' ')}\n💡 今日指南：宜 ${doAction} ｜ 忌 ${dontAction}\n\n【日曆小故事】\n${articleText}\n\n「${quoteText}」\n\n🎵 推薦配樂：${fullSongInfo}\n\n#日曆 #生活碎片 #${painTag} #攝影紀錄`;
            document.getElementById('igCaption').value = threadsText;
        }

        window.onload = function() { 
            setTimeout(() => { 
                randomizeAll(); 
                document.getElementById('calendar-paper').classList.add('anim-appear'); 
            }, 200); 
        };

        function copyText(elementId, btnId) {
            var copyText = document.getElementById(elementId);
            copyText.select(); document.execCommand("copy");
            var btn = document.getElementById(btnId);
            var originalText = btn.innerHTML; btn.innerHTML = "✅ 已複製！";
            setTimeout(function() { btn.innerHTML = originalText; }, 2000);
        }
    </script>
</body>
