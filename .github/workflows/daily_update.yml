name: Daily Taiji Calendar Update

on:
  schedule:
    - cron: '0 16 * * *' # 每天 UTC 16:00 (台灣時間半夜 00:00) 自動執行
  workflow_dispatch:      # 允許我們像現在一樣手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: ⚙️ 零一：注意！大腦的呼叫路徑已經改到 backend 資料夾了！
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend/taiji_engine.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html archive/
          git commit -m "Taiji Engine 🌌 Omniverse Sync: $(date +'%Y.%m.%d') 日常碎片與歷史檔案已封存" || echo "No changes to commit"
          git push
