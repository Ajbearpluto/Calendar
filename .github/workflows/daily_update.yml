name: Daily Taiji Calendar Update

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: ⚙️ 零一：啟動原生 HTTP 創世大腦
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend/taiji_engine.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html archive/
          git commit -m "Taiji Engine 🌌 Omniverse Sync: $(date +'%Y.%m.%d') 日常碎片與歷史檔案已封存" || echo "No changes to commit"
          git push
